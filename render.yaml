# Render blueprint for the API (FastAPI). Netlify serves the web client and forwards /api/* here
# (netlify.toml). Secrets are typed into the Render dashboard (sync: false), never committed.
# Starter plan: always on (the reminder loop keeps running) and outbound SMTP is allowed, so the
# Gmail notifications and deadline reminders work. The free plan would block both.
services:
  - type: web
    name: dada-academy-api
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: HOST
        value: 0.0.0.0
      - key: STORE
        value: auto
      # The spend counter lives on the server's disk and restarts at zero on each deploy, so keep
      # this low and set a credit limit on the OpenRouter key itself.
      - key: LLM_BUDGET_USD
        value: "1.0"
      # The Netlify front end forwards /api/* here; its browser writes carry that origin.
      - key: ALLOWED_ORIGINS
        value: https://dada-academy.netlify.app
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
