[project]
name = "dada-academy"
version = "1.0.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["docs/evidence", "web", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["docs/evidence", "web"]
